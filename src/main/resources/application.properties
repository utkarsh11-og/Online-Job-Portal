# Server port (supports cloud dynamic port injection)
server.port=${PORT:8080}

# Default Database fallback (H2 in-memory for testing/local dev)
spring.datasource.url=jdbc:h2:mem:jobportal
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 console enabled for testing (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate auto table management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT (supports environment variable injection)
jwt.secret=${JWT_SECRET:NGRhOGE1MmI5ZTM4YzQ0YTA4YTI3ODljNmU0MWU4M2E3Y2U5Mzg1ZjRiZGYxZjcyM2VkOTZkODBlODc2}
jwt.expiration=86400000