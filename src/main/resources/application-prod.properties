# ===================================================================
# JobSphere - Production Environment Profile (application-prod.properties)
# ===================================================================

# Server Configuration
server.port=${PORT:8080}

# MySQL Production Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jobportal}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}

# HikariCP Production Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=JobPortalProdHikariPool

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Disable in-memory test consoles in production
spring.h2.console.enabled=false

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Production Secrets (supports environment variable injection)
jwt.secret=${JWT_SECRET:NGRhOGE1MmI5ZTM4YzQ0YTA4YTI3ODljNmU0MWU4M2E3Y2U5Mzg1ZjRiZGYxZjcyM2VkOTZkODBlODc2}
jwt.expiration=86400000
